apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-ui
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-deployment
    spec:

      containers:
      - name: redpanda-container
        image: redpandadata/console
        ports:
        - name: client
          containerPort: 8080
        env:
        - name: KAFKA_BROKERS
          value: kafka-kafka-bootstrap:9092
        - name: KAFKA_TLS_ENABLED
          value: "false"
        - name: KAFKA_SASL_ENABLED
          value: "false"
