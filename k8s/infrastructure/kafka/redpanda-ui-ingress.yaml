apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redpanda-ui-ingress
  namespace: kafka
spec:
  ingressClassName: nginx
  rules:
  - host: redpanda.rafiki-poc.internal
    http:
      paths:
      - backend:
          service:
            name: redpanda-svc
            port:
              number: 8080
        path: /
        pathType: Prefix
