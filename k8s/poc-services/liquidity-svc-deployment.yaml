apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidity-svc
  namespace: poc
  labels:
    app: liquidity-svc
    app.kubernetes.io/name: liquidity-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidity-svc
      app.kubernetes.io/name: liquidity-svc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: liquidity-svc
        app.kubernetes.io/name: liquidity-svc
    spec:
      containers:
        - env:
            - name: OPEN_TELEMETRY_COLLECTOR_URL
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: LOG_LEVEL
              value: info
            - name: TB_CLUSTER_REPLICA_ADDRESSES
              value: tigerbeetle-single-svc.tigerbeetle.svc.cluster.local:13000
            - name: DATABASE_URL
              value: postgresql://postgres:Qy2lygdFKha9xdtLkxW3VfIlpds6V2kYguLrTqH4bPpQlKoI68y5spac9fBqcbtX@postgresql-cluster-rw.postgresql:5432/liquidity
            - name: MAX_BATCH_SIZE
              value: "200"
          image: k8scluster-registry.internal:5000/rafiki-poc-liquidity-svc:0.0.1
          livenessProbe:
            exec:
              command:
                - nc -z localhost 3000 || exit -1
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          name: liquidity-svc
          ports:
            - containerPort: 3000
      restartPolicy: Always

