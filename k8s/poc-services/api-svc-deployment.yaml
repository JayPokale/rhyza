apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-svc
  namespace: poc
  labels:
    app: api-svc
    app.kubernetes.io/name: api-svc
spec:
  #  replicas:
  selector:
    matchLabels:
      app: api-svc
      app.kubernetes.io/name: api-svc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: api-svc
        app.kubernetes.io/name: api-svc
    spec:
      #      nodeSelector:
      #        cloud.google.com/gke-nodepool: apps-pool
      containers:
        - env:
            - name: OPEN_TELEMETRY_COLLECTOR_URL
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: KAFKA_URL
              value: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_AUTH_ENABLED
              value: 'false'
            - name: KAFKA_AUTH_PROTOCOL
              value: SASL_PLAINTEXT
            - name: KAFKA_AUTH_MECHANISM
              value: PLAIN
            - name: KAFKA_AUTH_USERNAME
              value: NONE
            - name: KAFKA_AUTH_PASSWORD
              value: NONE
            - name: UV_THREADPOOL_SIZE
              value: '128'
            - name: LOG_LEVEL
              value: info
            - name: CONSUMER_BATCH_TIMEOUT_MS
              value: '15'
            - name: CONSUMER_BATCH_SIZE
              value: '1000'
          image: k8scluster-registry.internal:5000/rafiki-poc-api-svc:0.0.1
          # livenessProbe:
          #   exec:
          #     command:
          #       - nc -z localhost 3000 || exit -1
          #   failureThreshold: 10
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          #   timeoutSeconds: 10
          name: api-svc
          ports:
            - containerPort: 3000
      restartPolicy: Always
