apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-svc
  namespace: poc
  labels:
    app: api-svc
    app.kubernetes.io/name: api-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-svc
      app.kubernetes.io/name: api-svc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: api-svc
        app.kubernetes.io/name: api-svc
    spec:
      containers:
        - env:
            - name: OPEN_TELEMETRY_COLLECTOR_URL
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: KAFKA_URL
              value: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: UV_THREADPOOL_SIZE
              value: "128"
            - name: LOG_LEVEL
              value: info
          image: k8scluster-registry.internal:5000/rafiki-poc-api-svc:0.0.1
          livenessProbe:
            exec:
              command:
                - nc -z localhost 3000 || exit -1
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          name: api-svc
          ports:
            - containerPort: 3000
      restartPolicy: Always

