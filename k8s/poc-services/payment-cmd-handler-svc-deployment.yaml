apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-cmd-handler-svc
  namespace: poc
  labels:
    app: payment-cmd-handler-svc
    app.kubernetes.io/name: payment-cmd-handler-svc
spec:
  #  replicas: 1
  selector:
    matchLabels:
      app: payment-cmd-handler-svc
      app.kubernetes.io/name: payment-cmd-handler-svc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: payment-cmd-handler-svc
        app.kubernetes.io/name: payment-cmd-handler-svc
    spec:
      #      nodeSelector:
      #        cloud.google.com/gke-nodepool: apps-pool
      containers:
        - env:
            - name: OPEN_TELEMETRY_COLLECTOR_URL
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: DATABASE_URL
              value: postgresql://postgres:JV3nLfdCNiyjTzdLgO39h55sGElxBfhVd7mcmenNO5UhThLFWyBqJx9yvllik54h@postgresql-cluster-rw.postgresql:5432/payments
            - name: LOG_LEVEL
              value: info
            - name: SEED_FILE_LOCATION
              value: '/workspace/seed.json'
            - name: KAFKA_URL
              value: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: CONSUMER_BATCH_TIMEOUT_MS
              value: '25'
            - name: CONSUMER_BATCH_SIZE
              value: '1000'
            - name: LIQUIDITY_SERVICE_URL
              value: http://liquidity-svc:3001
          image: k8scluster-registry.internal:5000/rafiki-poc-payment-cmd-handler-svc:0.0.1
          #          image: europe-west1-docker.pkg.dev/rafiki-poc/rafiki-poc/payment-cmd-handler-svc:0.0.1
          imagePullPolicy: Always
          # livenessProbe:
          #   exec:
          #     command:
          #       - nc -z localhost 3000 || exit -1
          #   failureThreshold: 10
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          #   timeoutSeconds: 10
          name: payment-cmd-handler-svc

      restartPolicy: Always
