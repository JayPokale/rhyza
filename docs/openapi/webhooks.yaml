openapi: 3.1.0
info:
  title: Rhyza Webhooks API
  version: 0.0.0
  description: >-
    The main communication channel between an FSP and their Rhyza instance consists of the Admin API and webhook events. For Rhyza to notify an FSP about webhook events, the FSP must expose a webhook endpoint that listens for the dispatched events. The events provide time-sensitive status updates, warnings, and errors so that the FSP can react accordingly.
webhooks:
  paymentIntentCreated:
    post:
      summary: Payment intent created
      description: >-
        Sent when a payment intent is created for a recipient. At this point, the payment
        intent has not yet received any funds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentIntentEvent'
      responses:
        '200':
          description: Payment intent created
  paymentIntentCompleted:
    post:
      summary: Payment intent completed
      description: >-
        Sent when a payment intent has received its full incoming amount or if it was completed manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentIntentEvent'
      responses:
        '200':
          description: Payment intent completed
  paymentCreated:
    post:
      summary: Payment created
      description: |
        Sent when a payment is created and awaiting approval. The FSP should verify the sender's account balance and perform any other necessary checks before approving the payment via the Admin API's Approve Payment endpoint.

        If the sender has insufficient funds or if the payment should otherwise not be fulfilled, the FSP can cancel the payment via the Admin API's Cancel Payment endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEvent'
      responses:
        '200':
          description: Payment created
  paymentCompleted:
    post:
      summary: Payment completed
      description: |
        Sent when a payment has completed successfully or when as much as possible was sent to the recipient against the payment intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEvent'
      responses:
        '200':
          description: Payment completed
  paymentFailed:
    post:
      summary: Payment failed
      description: >-
        Sent when a payment failed to send and any retries were unsuccessful. The FSP should remove any holds on the sender's account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEventError'
      responses:
        '200':
          description: Payment failed

components:
  schemas:
    webhookEvent:
      type: object
      required:
        - id
        - type
        - data
      properties:
        id:
          type: string
          format: uuid
          description: A unique ID that the FSP can use to determine whether the event was previously received, preventing duplicate event processing
        type:
          type: string
          enum:
            - payment_intent.created
            - payment_intent.completed
            - payment.created
            - payment.completed
            - payment.failed
        data:
          type: object

    paymentIntentEvent:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment_intent.created
                - payment_intent.completed
            data:
              type: object
              required:
                - id
                - walletAddressId
                - createdAt
                - expiresAt
                - receiveAmount
              properties:
                id:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum:
                    - CREATED
                    - COMPLETED
                walletAddressId:
                  type: string
                  format: uuid
                incomingAmount:
                  $ref: '#/components/schemas/amount'
                receiveAmount:
                  $ref: '#/components/schemas/amount'
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time

    paymentEvent:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment.created
                - payment.completed
            data:
              type: object
              required:
                - id
                - walletAddressId
                - createdAt
                - debitAmount
                - sentAmount
                - receiveAmount
                - state
              properties:
                id:
                  type: string
                  format: uuid
                walletAddressId:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum:
                    - CREATED
                    - PROCESSING
                    - SENDING
                    - CONFIRMED
                    - REJECTED
                    - COMPLETED
                    - CANCELLED
                    - FAILED
                paymentIntentId:
                  type: string
                  format: uuid
                debitAmount:
                  $ref: '#/components/schemas/amount'
                sentAmount:
                  $ref: '#/components/schemas/amount'
                receiveAmount:
                  $ref: '#/components/schemas/amount'
                createdAt:
                  type: string
                  format: date-time
    paymentEventError:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment.failed
            data:
              type: object
              required:
                - id
                - paymentIntentId
                - errorName
                - message
              properties:
                id:
                  type: string
                  format: uuid
                paymentIntentId:
                  type: string
                  format: uuid
                errorName:
                  type: string
                message:
                  type: string
    amount:
      type: object
      required:
        - value
        - assetCode
        - assetScale
      properties:
        value:
          type: string
        assetCode:
          type: string
        assetScale:
          type: integer
