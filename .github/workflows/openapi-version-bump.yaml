name: Bump OpenAPI Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if OpenAPI spec changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^packages/admin-api-service/openapi.yaml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install yq
        if: steps.changes.outputs.changed == 'true'
        uses: mikefarah/yq@v4

      - name: Bump patch version
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION=$(yq '.info.version' packages/admin-api-service/openapi.yaml)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))

          yq -i ".info.version = \"$MAJOR.$MINOR.$PATCH\"" packages/admin-api-service/openapi.yaml

      - name: Commit version bump
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add packages/admin-api-service/openapi.yaml
          git commit -m "chore: bump OpenAPI version [skip ci]"
          git push

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        if: steps.changes.outputs.changed == 'true'

      - name: Setup Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v6

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Admin API client
        if: steps.changes.outputs.changed == 'true'
        run: pnpm generate
        working-directory: packages/admin-api-client
