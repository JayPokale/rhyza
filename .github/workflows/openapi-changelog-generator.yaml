name: OpenAPI Changelog Generator

on:
  pull_request:
    paths:
      - 'docs/openapi/admin/admin-api.yaml'

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Install oasdiff
        run: |
          curl -sSfL https://raw.githubusercontent.com/Tufin/oasdiff/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Fetch Base Branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Generate OpenAPI Changelog
        # TODO: Fix the path of the admin openapi file on origin after merge
        run: |
          git show origin/${{ github.base_ref }}:packages/admin-api-service/openapi.yaml > old-openapi.yaml
          oasdiff changelog old-openapi.yaml docs/openapi/admin/admin-api.yaml > oasdiff-changes.txt

      - name: Rebuild CHANGELOG.md from Main
        run: |
          if [ ! -s oasdiff-changes.txt ]; then
            echo "No meaningful OpenAPI changes detected. Exiting."
            exit 0
          fi

          echo "## OpenAPI Update - $(date +'%Y-%m-%d')" > new-changelog.md
          echo "" >> new-changelog.md
          cat oasdiff-changes.txt >> new-changelog.md
          echo "" >> new-changelog.md

          git show origin/${{ github.base_ref }}:docs/openapi/admin/CHANGELOG.md 2>/dev/null >> new-changelog.md || true

          mv new-changelog.md docs/openapi/admin/CHANGELOG.md

      - name: Commit back to PR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: rebuild CHANGELOG.md from main'
          file_pattern: 'CHANGELOG.md'
