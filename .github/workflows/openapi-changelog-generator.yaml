name: OpenAPI PR Changelog Generator

on:
  pull_request:
    paths:
      - 'docs/openapi/admin/admin-api.yaml'

jobs:
  check-client-generation:
    name: Check if admin-client was generated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK
        run: pnpm generate

      - name: Check for unstaged changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
             echo "ERROR: The generated admin client is out of sync with the API spec."
             echo "Please run 'pnpm generate' locally and commit the updated files."
             echo ""
             echo "Files changed:"
             git status --porcelain
             
             git diff
             
             exit 1
           else
             echo "Admin client is up to date!"
           fi

  check-changelog:
    runs-on: ubuntu-latest
    env:
      OPENAPI_SPEC_PATH: 'docs/openapi/admin/admin-api.yaml'
      OPENAPI_CHANGELOG_PATH: 'docs/openapi/admin/CHANGELOG.md'
      # TODO: replace main path to admin-api spec after merge
      OPENAPI_SPEC_PATH_MAIN: 'packages/admin-api-service/openapi.yaml'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch Base Branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Check if version was updated
        run: |
          API_VERSION=$(yq '.info.version' $OPENAPI_SPEC_PATH)
          API_VERSION_MAIN=$(git show origin/${{ github.base_ref }}:$OPENAPI_SPEC_PATH_MAIN | yq '.info.version')

          if [ "$API_VERSION" <= "$API_VERSION_MAIN" ]; then
            echo "ERROR: The API version in the admin spec has not changed. Please update it to reflect the changes."
            exit 1
          fi
      - name: Generate OpenAPI Changelog Text
        uses: oasdiff/oasdiff-action/changelog@v0
        with:
          base: 'origin/${{ github.base_ref }}:${{ env.OPENAPI_SPEC_PATH_MAIN}}'
          revision: '${{ env.OPENAPI_SPEC_PATH}}'
          format: markdown
          output-to-file: 'oasdiff-changes.txt'

      - name: Check CHANGELOG.md Update
        run: |
          python -c "
          import sys
          import os

          changes_file = 'oasdiff-changes.txt'
          changelog_file = '${{ env.OPENAPI_CHANGELOG_PATH }}'

          if not os.path.exists(changes_file) or os.path.getsize(changes_file) == 0:
              print('No meaningful OpenAPI changes detected. Exiting.')
              sys.exit(0)

          with open(changes_file, 'r') as f:
              generated = f.read().strip()
              
          if not generated:
              print('No meaningful OpenAPI changes detected. Exiting.')
              sys.exit(0)

          try:
              with open(changelog_file, 'r') as f:
                  actual = f.read()
          except FileNotFoundError:
              print(f'ERROR: {changelog_file} not found!')
              sys.exit(1)

          if generated not in actual:
              print(f'ERROR: The changelog is incomplete. Please generate it using oasdiff')
              print(generated)
              sys.exit(1)
              
          print(f'OpenAPI changes successfully found in {changelog_file}.')
          "
