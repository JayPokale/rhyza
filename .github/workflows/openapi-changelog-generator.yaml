name: OpenAPI PR Changelog Generator

on:
  pull_request:
    paths:
      - 'docs/openapi/admin/admin-api.yaml'

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch Base Branch
        run: git fetch origin ${{ github.base_ref }}

      # TODO: replace main path to admin-api spec after merge
      - name: Generate OpenAPI Changelog Text
        uses: oasdiff/oasdiff-action/changelog@v0
        with:
          base: 'origin/${{ github.base_ref }}:packages/admin-api-service/openapi.yaml'
          revision: 'docs/openapi/admin/admin-api.yaml'
          output-to-file: 'oasdiff-changes.txt'

      - name: Rebuild CHANGELOG.md from Main
        run: |
          if [ ! -s oasdiff-changes.txt ]; then
            echo "No meaningful OpenAPI changes detected. Exiting."
            exit 0
          fi

          API_VERSION=$(yq '.info.version' docs/openapi/admin/admin-api.yaml)

          echo "## $API_VERSION" > new-changelog.md
          echo "" >> new-changelog.md
          cat oasdiff-changes.txt >> new-changelog.md
          echo "" >> new-changelog.md

          git show origin/${{ github.base_ref }}:docs/openapi/admin/CHANGELOG.md 2>/dev/null >> new-changelog.md || true

          mv new-changelog.md docs/openapi/admin/CHANGELOG.md

      - name: Commit back to PR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: rebuild CHANGELOG.md from main'
          file_pattern: 'docs/openapi/admin/CHANGELOG.md'
