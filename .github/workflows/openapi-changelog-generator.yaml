name: OpenAPI PR Changelog Generator

on:
  pull_request:
    paths:
      - 'docs/openapi/admin/admin-api.yaml'

jobs:
  check-client-generation:
    name: Check if admin-client was generated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK
        run: pnpm generate

      - name: Check for unstaged changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
             echo "ERROR: The generated admin client is out of sync with the API spec."
             echo "Please run 'pnpm generate' locally and commit the updated files."
             echo ""
             echo "Files changed:"
             git status --porcelain
             
             git diff
             
             exit 1
           else
             echo "Admin client is up to date!"
           fi

  update-changelog:
    runs-on: ubuntu-latest
    needs: check-client-generation
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch Base Branch
        run: git fetch origin ${{ github.base_ref }}

      # TODO: replace main path to admin-api spec after merge
      - name: Generate OpenAPI Changelog Text
        uses: oasdiff/oasdiff-action/changelog@v0
        with:
          base: 'origin/${{ github.base_ref }}:packages/admin-api-service/openapi.yaml'
          revision: 'docs/openapi/admin/admin-api.yaml'
          output-to-file: 'oasdiff-changes.txt'

      - name: Rebuild CHANGELOG.md from Main
        run: |
          if [ ! -s oasdiff-changes.txt ]; then
            echo "No meaningful OpenAPI changes detected. Exiting."
            exit 0
          fi

          API_VERSION=$(yq '.info.version' docs/openapi/admin/admin-api.yaml)

          echo "## $API_VERSION" > new-changelog.md
          echo "" >> new-changelog.md
          cat oasdiff-changes.txt >> new-changelog.md
          echo "" >> new-changelog.md

          git show origin/${{ github.base_ref }}:docs/openapi/admin/CHANGELOG.md 2>/dev/null >> new-changelog.md || true

          mv new-changelog.md docs/openapi/admin/CHANGELOG.md

      - name: Commit back to PR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: rebuild CHANGELOG.md from main'
          file_pattern: 'docs/openapi/admin/CHANGELOG.md'
