name: E2E tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v6

      - uses: pnpm/action-setup@v4

      - name: Generate admin-client
        run: |
          pnpm generate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: |
          pnpm e2e
