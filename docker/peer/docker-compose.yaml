services:
  api-peer:
    image: rafiki-poc-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      SEED_FILE_LOCATION: /workspace/docker/peer/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg-container-peer:5432/database
    depends_on:
      pg-container-peer:
        condition: service_healthy
    networks:
      - rafiki-poc
      
  pg-container-peer:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - '5433:5432'
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres-data-peer:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "database"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - rafiki-poc

volumes:
  postgres-data-peer: