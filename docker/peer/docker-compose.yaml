services:
  app-peer:
    image: rafiki-poc-app
    restart: always
    ports:
      - '3001:3001'
    environment:
      SEED_FILE_LOCATION: /workspace/docker/peer/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg_container:5432/database
    networks:
      - rafiki-poc