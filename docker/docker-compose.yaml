name: rafiki-poc
services:
  app:
    build:
      context: ../
      #dockerfile: ./docker/Dockerfile
      dockerfile: ./docker/Dockerfile-app
    restart: always
    depends_on:
      - init-kafka
    ports:
      - '3000:3000'
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      KAFKA_URL: kafka:19092
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml

  prometheus:
    image: prom/prometheus:latest
    command: 
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"

  zoo:
    image: confluentinc/cp-zookeeper:7.2.1
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo:2888:3888

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - zoo
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10

  init-kafka:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Existing kafka topics:'
      kafka-topics --bootstrap-server kafka:19092 --list
      echo -e '\nCreating kafka topics:'
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic audits
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic logs
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic rafiki-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic incoming-payment-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic quote-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic outgoing-payment-from-quote-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic api-request-commands
      echo -e '\nSuccessfully created the following topics:'
      kafka-topics --bootstrap-server kafka:19092 --list
      "
