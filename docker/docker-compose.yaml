name: rafiki-poc
services:
  api-1:
    build:
      context: ../
      dockerfile: ./packages/api/Dockerfile-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg-container:5432/database
      KAFKA_URL: kafka:19092
      SERVICE_MODE: api
    depends_on:
      - backend
      - pg-container
    networks:
      - rafiki-poc

  api-2:
    build:
      context: ../
      dockerfile: ./packages/api/Dockerfile-api
    restart: always
    ports:
      - '3001:3000'
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg-container:5432/database
      KAFKA_URL: kafka:19092
      SERVICE_MODE: api
    depends_on:
      - backend
      - pg-container
    networks:
      - rafiki-poc

  backend:
    build:
      context: ../
      dockerfile: ./packages/payments-service/Dockerfile-backend
    restart: always
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      KAFKA_URL: kafka:19092
      DATABASE_URL: postgres://postgres:password@pg-container:5432/database
      SERVICE_MODE: backend
    depends_on:
      - init-kafka
    networks:
      - rafiki-poc

  pg-container:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "database"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - rafiki-poc

  zoo:
    image: confluentinc/cp-zookeeper:7.2.1
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo:2888:3888
    networks:
      - rafiki-poc

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - zoo
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - rafiki-poc

  init-kafka:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Existing kafka topics:'
      kafka-topics --bootstrap-server kafka:19092 --list
      echo -e '\nCreating kafka topics:'
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic audits
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic logs
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --partitions 3 --topic rafiki-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --partitions 3 --topic incoming-payment-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --partitions 3 --topic quote-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --partitions 3 --topic outgoing-payment-from-quote-commands
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic api-request-commands
      echo -e '\nSuccessfully created the following topics:'
      kafka-topics --bootstrap-server kafka:19092 --list
      "
    networks:
      - rafiki-poc

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - rafiki-poc

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - rafiki-poc

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-1
      - api-2
    networks:
      - rafiki-poc

networks:
  rafiki-poc:

volumes:
  postgres-data:
