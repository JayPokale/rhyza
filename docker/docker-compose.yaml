name: rafiki-poc
services:
  api:
    build:
      context: ../
      dockerfile: ./packages/api-svc/Dockerfile
    restart: always
    environment:
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      REDIS_URL: redis://redis:6379
      KAFKA_URL: kafka:19092
      LOG_LEVEL: info
      UV_THREADPOOL_SIZE: 128
    depends_on:
       pg-container:
          condition: service_healthy
       init-kafka:
          condition: service_completed_successfully
    networks:
      - rafiki-poc

  liquidity-service:
     build:
        context: ../
        dockerfile: ./packages/liquidity-svc/Dockerfile
     restart: always
     security_opt:
        - seccomp:unconfined
     environment:
        API_PORT: 3000
        OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
        DATABASE_URL: postgres://postgres:password@pg-container:5432/liquidity-service
        TB_CLUSTER_REPLICA_ADDRESSES: 10.5.1.51:4342
        LOG_LEVEL: info
        MAX_BATCH_SIZE: 200
     depends_on:
        pg-container:
           condition: service_healthy
     healthcheck:
        test: nc -z 0.0.0.0 3000 || exit -1
        start_period: 40s
        interval: 10s
        timeout: 10s
        retries: 10
     networks:
        - rafiki-poc

  backend:
    build:
      context: ../
      dockerfile: ./packages/payments-command-handler-svc/Dockerfile
    restart: always
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg-container:5432/payments-service
      REDIS_URL: redis://redis:6379
      KAFKA_URL: kafka:19092
      LIQUIDITY_SERVICE_URL: http://liquidity-service:3000
      LOG_LEVEL: info
      UV_THREADPOOL_SIZE: 64
      CACHE_DURATION_MS: 3600000
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      liquidity-service:
        condition: service_healthy
      pg-container:
         condition: service_healthy
    networks:
      - rafiki-poc


  pg-container:
    image: postgres
    command: -c 'max_connections=200'
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - ./db/:/docker-entrypoint-initdb.d/
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "database"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - rafiki-poc

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://kafka:9092
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: nc -z localhost 19092 || exit -1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "9092:9092"
    networks:
      - rafiki-poc

  redpanda-console:
    depends_on:
      - kafka
    image: redpandadata/console:latest
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:19092
    ports:
      - 8080:8080
    networks:
      - rafiki-poc

  init-kafka:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
         condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /opt/kafka/bin/
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Existing kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      echo -e '\nCreating kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic audits
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic logs
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic payment-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic api-response-events
      echo -e '\nSuccessfully created the following topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      "
    networks:
      - rafiki-poc

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - rafiki-poc

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
       - "4317:4317"
       - "4318:4318"
    networks:
      - rafiki-poc

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - rafiki-poc

  tempo:
    image: grafana/tempo:latest
    command: "-config.file=/etc/tempo.yaml"
    networks:
      - rafiki-poc
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:latest
    ports:
      - "4501:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - rafiki-poc

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - rafiki-poc
    sysctls:
      net.ipv4.ip_local_port_range: "10240 65535"

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.32
    privileged: true
    volumes:
      - tigerbeetle-data:/var/lib/tigerbeetle
    ports:
      - "4342:4342"
    networks:
      rafiki-poc:
        ipv4_address: 10.5.1.51
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -ex
        DATA_FILE=/var/lib/tigerbeetle/cluster_0_replica_0.tigerbeetle
        set +e
        ls $$DATA_FILE
        DATA_FILE_EXISTS="$$?"
        set -e
        echo $$DATA_FILE_EXISTS
        if [ "$$DATA_FILE_EXISTS" != 0 ]; then
          ./tigerbeetle format --cluster=0 --replica=0 --replica-count=1 $$DATA_FILE;
        fi
        hostname -i
        ls /var/lib/tigerbeetle
        ./tigerbeetle start --addresses=0.0.0.0:4342 --development $$DATA_FILE

networks:
  rafiki-poc:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.1.0/24

volumes:
  tigerbeetle-data:
  postgres-data:
  grafana-data:
  tempo-data:
