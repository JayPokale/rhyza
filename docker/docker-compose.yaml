name: rafiki-poc
services:
  api:
    build:
      context: ../
      dockerfile: ./packages/api/Dockerfile
    restart: always
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg-container:5432/database
      REDIS_URL: redis://redis:6379
      KAFKA_URL: kafka:19092
    depends_on:
      - backend
      - pg-container
    networks:
      - rafiki-poc

  backend:
    build:
      context: ../
      dockerfile: ./packages/payments-service/Dockerfile
    restart: always
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg-container:5432/database
      REDIS_URL: redis://redis:6379
      KAFKA_URL: kafka:19092
      LIQUIDITY_SERVICE_URL: http://liquidity-service:3000
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      liquidity-service:
        condition: service_healthy
    networks:
      - rafiki-poc

  liquidity-service:
    build:
      context: ../
      dockerfile: ./packages/liquidity-service/Dockerfile
    restart: always
    environment:
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      DATABASE_URL: postgres://postgres:password@pg-container:5432/database
      TB_REPLICA_ADDRESSES: 10.5.0.50:4342
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    healthcheck:
      test: nc -z 0.0.0.0 3000 || exit -1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - rafiki-poc

  pg-container:
    image: postgres
    command: -c 'max_connections=200'
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "database"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - rafiki-poc

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: nc -z localhost 19092 || exit -1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - rafiki-poc

  init-kafka:
    image: apache/kafka:4.0.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /opt/kafka/bin/
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Existing kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      echo -e '\nCreating kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic audits
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic logs
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 3 --topic incoming-payment-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 3 --topic quote-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 3 --topic outgoing-payment-from-quote-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 2 --topic api-response-events
      echo -e '\nSuccessfully created the following topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      "
    networks:
      - rafiki-poc

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - rafiki-poc

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - rafiki-poc

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - rafiki-poc

  grafana:
    image: grafana/grafana:latest
    ports:
      - "4501:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - rafiki-poc

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - rafiki-poc
    sysctls:
      net.ipv4.ip_local_port_range: "10240 65535"

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.32
    privileged: true
    volumes:
      - tigerbeetle-data:/var/lib/tigerbeetle
    networks:
      rafiki-poc:
        ipv4_address: 10.5.0.50
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -ex
        DATA_FILE=/var/lib/tigerbeetle/cluster_0_replica_0.tigerbeetle
        set +e
        ls $$DATA_FILE
        DATA_FILE_EXISTS="$$?"
        set -e
        echo $$DATA_FILE_EXISTS
        if [ "$$DATA_FILE_EXISTS" != 0 ]; then 
          ./tigerbeetle format --cluster=0 --replica=0 --replica-count=1 $$DATA_FILE; 
        fi
        hostname -i
        ls /var/lib/tigerbeetle
        ./tigerbeetle start --addresses=0.0.0.0:4342 --development $$DATA_FILE

networks:
  rafiki-poc:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24

volumes:
  tigerbeetle-data:
  postgres-data:
  grafana-data:
