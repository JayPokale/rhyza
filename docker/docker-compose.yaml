name: rafiki-poc
services:
  api:
    build:
      context: ../
      dockerfile: ./packages/api/Dockerfile
    # restart: always
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      OPEN_TELEMETRY_COLLECTOR_URL: http://otel-collector:4317
      # DATABASE_URL: postgres://postgres:password@pg-container:5432/database
      DATABASE_URL: postgres://postgres:password@localhost:5432/database
    depends_on:
      pg-container:
        condition: service_healthy
    # networks:
    #   - rafiki-poc
    network_mode: host

  pg-container:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "database"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - rafiki-poc

  otel-collector:
    # uses default port 4317
    image: otel/opentelemetry-collector:latest
    network_mode: host
    command: "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml

  prometheus:
    # uses default port 9090
    image: prom/prometheus:latest
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml

  nginx:
    image: nginx:latest
    network_mode: host
    # ports:
    #   - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    # ulimits:
    #   nofile:
    #     soft: 1048575
    #     hard: 1048575
    # networks:
    #   - rafiki-poc
    # sysctls:
    #   net.ipv4.ip_local_port_range: "10240 65535"

networks:
  rafiki-poc:

volumes:
  postgres-data:
