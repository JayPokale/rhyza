syntax = "proto3";
package rafiki.ilp.svc;

service IlpGrpc {
  rpc CreatePeer(CreatePeerRequest) returns (CreatePeerResponse);
  rpc GetPeer(GetPeerRequest) returns (GetPeerResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc UpdatePeer(UpdatePeerRequest) returns (UpdatePeerResponse);
  rpc ResolvePeerByAddress(ResolvePeerByAddressRequest) returns (ResolvePeerByAddressResponse);

  rpc ProcessPreparePacket(ProcessPreparePacketRequest) returns (ProcessPreparePacketResponse);
  rpc ProcessFulfillPacket(ProcessFulfillPacketRequest) returns (ProcessFulfillPacketResponse);
  rpc ProcessRejectPacket(ProcessRejectPacketRequest) returns (ProcessRejectPacketResponse);
  rpc ExpirePacket(ExpirePacketRequest) returns (ExpirePacketResponse);
}

message CorrelationIds {
  string request_id = 1;
  string payment_intent_ref = 2;
  optional string quote_id = 3;
  optional string outgoing_payment_id = 4;
  optional string packet_id = 5;
  optional string peer_id = 6;
}

/* 
Peer configuration messages
*/

message PeerHttpOutgoingSettings {
  string endpoint = 1;
  string auth_token = 2;
}

message PeerHttpIncomingSettings {
  optional string auth_token = 1;
}

message PeerHttpSettings {
  PeerHttpOutgoingSettings outgoing = 1;
  optional PeerHttpIncomingSettings incoming = 2;
}

message PeerRoutingSettings {
  string static_ilp_address = 1;
  repeated string route_prefixes = 2;
}

// ILP BC view of a peer.
message Peer {
  string id = 1;
  PeerHttpSettings http = 2;
  PeerRoutingSettings routing = 3;
  optional uint64 max_packet_amount = 4;
  optional bool is_active = 5;
}

/* 
Peer lifecycle messages 
*/

message CreatePeerRequest {
  CorrelationIds correlation = 1;
  Peer peer = 2;
}

message CreatePeerResponse {
  CorrelationIds correlation = 1;
  Peer peer = 2;
}

message GetPeerRequest {
  CorrelationIds correlation = 1;
  string id = 2;
}

message GetPeerResponse {
  CorrelationIds correlation = 1;
  optional Peer peer = 2;
}

message ListPeersRequest {
  CorrelationIds correlation = 1;
}

message ListPeersResponse {
  CorrelationIds correlation = 1;
  repeated Peer peers = 2;
}

message UpdatePeerRequest {
  CorrelationIds correlation = 1;
  Peer peer = 2;
}

message UpdatePeerResponse {
  CorrelationIds correlation = 1;
  Peer peer = 2;
}

/* 
Peer resolution messages 
*/

message ResolvePeerByAddressRequest {
  CorrelationIds correlation = 1;
  string destination_ilp_address = 2;
}

message ResolvePeerByAddressResponse {
  CorrelationIds correlation = 1;
  string peer_id = 2;
  string matched_prefix = 3;
}

/* 
Packet-level value messages
*/

message PacketPrepare {
  string destination_ilp_address = 1;
  uint64 amount = 2;
  string execution_condition = 3;
  string expires_at = 4;
  bytes data = 5;
}

message PacketFulfill {
  string fulfillment = 1;
  string fulfilled_at = 2;
  bytes data = 3;
}

message PacketReject {
  string code = 1;
  string message = 2;
  optional string triggered_by = 3;
  string rejected_at = 4;
  bytes data = 5;
}

message PacketExpiry {
  string expired_at = 1;
}

/*
Packet ingress / terminal states messages
*/

message ProcessPreparePacketRequest {
  CorrelationIds correlation = 1;
  PacketPrepare prepare = 2;
}

message ProcessPreparePacketResponse {
  CorrelationIds correlation = 1;
  string packet_id = 2;
}

message ProcessFulfillPacketRequest {
  CorrelationIds correlation = 1;
  PacketFulfill fulfill = 2;
}

message ProcessFulfillPacketResponse {
  CorrelationIds correlation = 1;
  string packet_id = 2;
}

message ProcessRejectPacketRequest {
  CorrelationIds correlation = 1;
  PacketReject reject = 2;
}

message ProcessRejectPacketResponse {
  CorrelationIds correlation = 1;
  string packet_id = 2;
}

message ExpirePacketRequest {
  CorrelationIds correlation = 1;
  PacketExpiry expiry = 2;
}

message ExpirePacketResponse {
  CorrelationIds correlation = 1;
  string packet_id = 2;
}
