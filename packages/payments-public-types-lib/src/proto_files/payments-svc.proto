syntax = "proto3";
package rafiki.payments.service;

// Service for managing payment resources.
service PaymentsGrpc {
  // Creates a new incoming payment.
  rpc CreateIncomingPayment(CreateIncomingPaymentRequest) returns (CreateIncomingPaymentResponse);
  // Retrieves an incoming payment by ID.

  // Creates a new quote.
  rpc CreateQuote(CreateQuoteRequest) returns (CreateQuoteResponse);

  // Creates a new outgoing payment.
  rpc CreateOutgoingPayment(CreateOutgoingPaymentRequest) returns (CreateOutgoingPaymentResponse);
}

/*
 * Incoming Payment messages
 */

// Request to create a new incoming payment.
message CreateIncomingPaymentRequest {
  string id = 1;
  string wallet_address_id = 2;
  string wallet_address = 6;
  optional uint64 incoming_amount = 3;
  optional string expires_at = 4;
  optional string metadata = 5;
}

// Response containing the ID of the created incoming payment.
message CreateIncomingPaymentResponse {
  string id = 1;
}

/*
 * Quote messages
 */

// Request to create a new quote.
message CreateQuoteRequest {
  string id = 1;
  string wallet_address_id = 2;
  string wallet_address = 3;
  string incoming_payment_id = 4;
  optional uint64 debit_amount = 5;
  optional uint64 receive_amount = 6;
}

// Response containing the ID of the created quote.
message CreateQuoteResponse {
  string id = 1;
}

/*
 * Outgoing Payment messages
 */

// Request to create a new outgoing payment.
message CreateOutgoingPaymentRequest {
  string id = 1;
  string wallet_address_id = 2;
  string wallet_address = 3;
  string incoming_payment_id = 4;
  optional string quote_id = 5;
  optional uint64 debit_amount = 6;
}

// Response containing the ID of the created outgoing payment.
message CreateOutgoingPaymentResponse {
  string id = 1;
}

