syntax = "proto3";
package rafiki.payments.svc;

// Service for managing payment resources.
service PaymentsGrpc {
  // Creates a new incoming payment.
  rpc CreateIncomingPayment(CreateIncomingPaymentRequest) returns (CreateIncomingPaymentResponse);
  // Retrieves an incoming payment by ID.
  rpc GetIncomingPayment(GetIncomingPaymentRequest) returns (GetIncomingPaymentResponse);
}

/*
 * Incoming Payment messages
 */

// Request to create a new incoming payment.
message CreateIncomingPaymentRequest {
  string id = 1;
  string wallet_address_id = 2;
  string wallet_address = 6;
  optional uint64 incoming_amount = 3;
  optional string expires_at = 4;
  optional string metadata = 5;
}

// Response containing the ID of the created incoming payment.
message CreateIncomingPaymentResponse {
  string id = 1;
}

// Request to retrieve an incoming payment by ID.
message GetIncomingPaymentRequest {
  string id = 1;
}

// Response wrapper for an incoming payment lookup.
message GetIncomingPaymentResponse {
  optional GetNonEmptyIncomingPaymentResponse incoming_payment = 1;
}

// Full incoming payment resource returned on successful lookup.
message GetNonEmptyIncomingPaymentResponse {
  string id = 1;
  string wallet_address_id = 2;
  string state = 3;
  uint64 received_amount = 4;
  string asset_code = 5;
  uint32 asset_scale = 6;
  optional uint64 incoming_amount = 7;
  optional string expires_at = 8;
  optional string metadata = 9;
}
