syntax = "proto3";
package rafiki.auth.service;

service RafikiAuth {
	// Grant RPCs
	rpc CreateGrant(GrantRequest) returns (CreateGrantResponse) {}
	rpc GetGrant(GetGrantRequest) returns (Grant) {}
	rpc ContinueGrant(ContinueGrantRequest) returns (ContinueGrantResponse) {}
	rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse) {}
	// Access Token RPCs
	rpc IntrospectToken(IntrospectTokenRequest) returns (IntrospectTokenResponse) {}
	rpc RotateToken(RotateTokenRequest) returns (RotateTokenResponse) {}
	rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {}
	// Interaction RPCs
	rpc AcceptInteraction(AcceptInteractionRequest)  returns (HandleInteractionChoiceResponse) {}
	rpc RejectInteraction(RejectInteractionRequest) returns (HandleInteractionChoiceResponse) {}
}

message AccessItem {
	string type = 1;
	AccessLimits limits = 2;
	repeated string actions = 3;
	string identifier = 4;
}

message AccessToken {
	string value = 1;
	string management_id = 2;
	int32 expires_in = 3;
	string revoked_at = 4; // Date string
}

message Interaction {
	string interact_ref = 1;
	string client_nonce = 2;
	string state = 3;
	int64 expires_in_ms = 4;
}

message Grant {
	string id = 1;
	repeated string start = 2;
	string continue_token = 3;
	string continue_id = 4;
	string state = 5;
	string finalization = 6;
	string client = 7;
	repeated SubjectId sub_ids = 8;
	repeated AccessItem accesses = 9;
	string finish_method = 10;
	string finish_uri = 11;
	Interaction interaction = 12;
	string last_continued_at = 13; // Date string
	repeated AccessToken access_tokens = 14;
}

message AccessLimits {
	string receiver = 1;
	string debit_amount_value = 2;
	string receive_amount_value = 3;
	string asset_code = 4;
	int32 asset_scale = 5;
	string interval = 6;
}

message GrantRequestFinish {
	string finish = 1;
	string uri = 2;
	string nonce = 3;
}

message SubjectId {
	string format = 1;
	string id = 2;
}

message SignatureHeader {
	string name = 1;
	string value = 2;
}

message SignatureData {
	string url = 1;
	string method = 2;
	string body = 3;
	repeated SignatureHeader headers = 4;
}

message GrantRequest {
	repeated AccessItem access = 1;
	string client = 2;
	Subject subject = 3;
	repeated string start = 4;
	GrantRequestFinish finish = 5;
	SignatureData signature_data = 6;
}

message CreateGrantResponse {
	string id = 1;
	string continue_id = 2;
	string continue_token = 3;
	string interact_nonce = 4;
	string access_token_value = 5;
	string access_token_management_id = 6;
	int32 access_token_expires_in = 7;
	repeated AccessItem access = 8;
	repeated SubjectId sub_ids = 9;
}

message GetGrantRequest {
	string id = 1;
}

message ContinueGrantRequest {
	string id = 1;
	string continue_id = 2;
	string continue_token = 3;
	string interact_ref = 4;
}

message ContinueGrantResponse {
	string id = 1;
	string finalization_reason = 2;
	string access_token_value = 3;
	string access_token_management_id = 4;
	int32 access_token_expires_in = 5;
	repeated AccessItem access = 6;
	string continue_id = 7;
	string continue_token = 8;
}

message RevokeGrantRequest {
	string id = 1;
	string continue_id = 2;
	string continue_token = 3;
}

message RevokeGrantResponse {
	string id = 1;
}

message IntrospectTokenResponse {
	bool active = 1;
	string grant_id = 2;
	repeated AccessItem access = 3;
}

message IntrospectTokenRequest {
	string id = 1; // grant id
	string token_value = 2;
	repeated AccessItem access = 3;
}

message RotateTokenRequest {
	string id = 1; // grant id
	string token_value = 2;
	string management_id = 3;
}

message RotateTokenResponse {
	string grant_id = 1;
	string new_access_token_value = 2;
	string new_access_token_management_id = 3;
	int32 new_access_token_expires_in = 4;
	repeated AccessItem access = 5;
}

message RevokeTokenRequest {
	string id = 1; // grant id
	string token_value = 2;
	string management_id = 3;
}

message RevokeTokenResponse {
	string id = 1;
}

message HandleInteractionChoiceResponse {
	bool success = 1;
}

message AcceptInteractionRequest {
	string id = 1; // grant id
	string interact_ref = 2;
	string nonce = 3;
}

message RejectInteractionRequest {
	string id = 1; // grant id
	string nonce = 2;
}
