# crd.yaml
#
# Custom Resource Definition (CRD)
#
# This tells Kubernetes about the new resource type "RafikiInstance".
# After applying this file, you can use:
#   kubectl get rafikiinstances
#   kubectl apply -f my-rafiki.yaml
#
# Think of a CRD like registering a new table schema in a database.
# The CRD defines the schema; individual RafikiInstance objects are the rows.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rafikiinstances.rafiki.interledger.org
spec:
  # The API group — used in apiVersion: rafiki.interledger.org/v1alpha1
  group: rafiki.interledger.org

  # "Namespaced" means each RafikiInstance belongs to a specific namespace,
  # just like a Deployment or Service does.
  scope: Namespaced

  names:
    # plural: used in API paths and kubectl (kubectl get rafikiinstances)
    plural: rafikiinstances
    # singular: used in kubectl describe
    singular: rafikiinstance
    # kind: used in YAML files (kind: RafikiInstance)
    kind: RafikiInstance
    # shortNames: shorthand for kubectl (kubectl get ri)
    shortNames:
      - ri

  versions:
    - name: v1alpha1
      served: true # This version is available via the API
      storage: true # This version is the one stored in etcd

      # additionalPrinterColumns: what kubectl get rafikiinstances shows
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: LastReconciled
          type: string
          jsonPath: .status.lastReconciled

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - mongoPasswordSecretRef
                - imageTag
                - imageRegistry
                - webhookUrl
              properties:
                replicas:
                  type: integer
                  default: 1
                  minimum: 1
                  description: 'Number of replicas for stateless app services'
                mongoPasswordSecretRef:
                  type: object
                  description: >-
                    Reference to an existing Secret (in this namespace)
                    holding the MongoDB root password, created and rotated
                    by the integrator outside the operator. The operator
                    only reads it — it never generates or stores the
                    password itself.
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      description: 'Name of the Secret'
                    key:
                      type: string
                      description: 'Key within the Secret holding the password'
                imageTag:
                  type: string
                  description: 'Container image tag for all Rafiki services (e.g. latest, v1.2.3)'
                imageRegistry:
                  type: string
                  description: 'Container image registry prefix (e.g. ghcr.io/interledger/rafiki-v2)'
                webhookUrl:
                  type: string
                  description: 'Webhook URL for the notifications service'
                observability:
                  type: boolean
                  default: true
                  description: 'Whether to deploy the observability stack'
                host:
                  type: string
                  description: >-
                    Public hostname for the Open Payments resource server
                    (e.g. payments.integrator.com). This is the only service
                    exposed outside the cluster. When set, the operator
                    creates an Ingress and injects this value as
                    OPEN_PAYMENTS_RESOURCE_SERVER_URL. Omit to keep the
                    resource server ClusterIP-only.
                tlsSecretName:
                  type: string
                  description: >-
                    Name of an existing kubernetes.io/tls Secret (in this
                    namespace) holding the certificate for `host`, created
                    and rotated by the integrator. Required if `host` is set
                    and `tlsIssuer` isn't.
                tlsIssuer:
                  type: string
                  description: >-
                    Name of a cert-manager ClusterIssuer to request a
                    certificate from automatically, as an alternative to
                    tlsSecretName. Requires cert-manager to be installed;
                    the operator does not install or require it.
                ingressClassName:
                  type: string
                  description: >-
                    IngressClassName for the generated Ingress. Omit to use
                    the cluster default IngressClass.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Degraded, Error]
                message:
                  type: string
                lastReconciled:
                  type: string
                observedGeneration:
                  type: integer

      # subresources.status lets the operator update .status separately
      # from .spec, which prevents accidental spec overwrites.
      subresources:
        status: {}
