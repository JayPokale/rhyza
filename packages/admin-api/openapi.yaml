openapi: 3.1.0
info:
  title: Rafiki Admin API
  version: 0.0.0
tags: []
paths:
  /assets:
    get:
      operationId: Assets_list
      description: Paginate over assets
      parameters:
        - $ref: '#/components/parameters/PaginationParameters.cursor'
        - $ref: '#/components/parameters/PaginationParameters.first'
        - $ref: '#/components/parameters/PaginationParameters.last'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - result
                properties:
                  pagination:
                    $ref: '#/components/schemas/PageInfo'
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
    post:
      operationId: Assets_createAsset
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                required:
                  - code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
  /assets/{code}:
    patch:
      operationId: Assets_updateAsset
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdate'
  /assets/{code}/liquidity/deposit:
    post:
      operationId: Assets_depositLiquidity
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiquidityRequest'
  /assets/{code}/liquidity/withdraw:
    post:
      operationId: Assets_withdrawLiquidity
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiquidityRequest'
  /incoming-payments:
    post:
      operationId: IncomingPayments_createIncomingPayment
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingPaymentCreate'
  /incoming-payments/{id}:
    get:
      operationId: IncomingPayments_getIncomingPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingPayment'
  /outgoing-payments:
    post:
      operationId: OutgoingPayments_createOutgoingPayment
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutgoingPaymentCreate'
  /outgoing-payments/{id}:
    get:
      operationId: OutgoingPayments_getOutgoingPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingPayment'
  /outgoing-payments/{id}/approve:
    post:
      operationId: OutgoingPayments_approveOutgoingPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutgoingPaymentApprove'
  /outgoing-payments/{id}/reject:
    post:
      operationId: OutgoingPayments_rejectOutgoingPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutgoingPaymentReject'
  /peers:
    get:
      operationId: Peers_list
      description: Paginate over peers
      parameters:
        - $ref: '#/components/parameters/PaginationParameters.cursor'
        - $ref: '#/components/parameters/PaginationParameters.first'
        - $ref: '#/components/parameters/PaginationParameters.last'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - result
                properties:
                  pagination:
                    $ref: '#/components/schemas/PageInfo'
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Peer'
    post:
      operationId: Peers_createPeer
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeerCreate'
  /peers/{id}:
    get:
      operationId: Peers_getPeer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peer'
    patch:
      operationId: Peers_updatePeer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeerUpdate'
  /peers/{id}/liquidity/deposit:
    post:
      operationId: Peers_depositLiquidity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiquidityRequest'
  /peers/{id}/liquidity/withdraw:
    post:
      operationId: Peers_withdrawLiquidity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiquidityRequest'
  /quotes:
    post:
      operationId: Quotes_createQuote
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreate'
  /quotes/{id}:
    get:
      operationId: Quotes_getQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
  /wallet-addresses:
    get:
      operationId: WalletAddresses_list
      description: Paginate over wallet addresses
      parameters:
        - $ref: '#/components/parameters/PaginationParameters.cursor'
        - $ref: '#/components/parameters/PaginationParameters.first'
        - $ref: '#/components/parameters/PaginationParameters.last'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - result
                properties:
                  pagination:
                    $ref: '#/components/schemas/PageInfo'
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletAddress'
    post:
      operationId: WalletAddresses_createWalletAddress
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                required:
                  - address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAddressCreate'
  /wallet-addresses/{address}:
    get:
      operationId: WalletAddresses_getWalletAddress
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddress'
    patch:
      operationId: WalletAddresses_updateWalletAddress
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAddressUpdate'
  /wallet-addresses/{address}/keys:
    get:
      operationId: Keys_listKeys
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletAddressKey'
    post:
      operationId: Keys_createKey
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAddressKey'
components:
  parameters:
    PaginationParameters.cursor:
      name: cursor
      in: query
      required: false
      description: The cursor key to list from.
      schema:
        type: string
      explode: false
    PaginationParameters.first:
      name: first
      in: query
      required: false
      description: The number of items to return after the cursor.
      schema:
        type: number
      explode: false
    PaginationParameters.last:
      name: last
      in: query
      required: false
      description: The number of items to return before the cursor.
      schema:
        type: number
      explode: false
  schemas:
    Amount:
      type: object
      required:
        - value
        - assetCode
        - assetScale
      properties:
        value:
          type: number
        assetCode:
          type: string
        assetScale:
          type: number
    Asset:
      type: object
      required:
        - code
        - scale
      properties:
        code:
          type: string
        scale:
          type: number
        liquidityLowThreshold:
          type: integer
        liquidityHighThreshold:
          type: integer
        initialLiquidity:
          type: integer
    AssetUpdate:
      type: object
      properties:
        liquidityLowThreshold:
          type: integer
        liquidityHighThreshold:
          type: integer
    IlpPeerSettings:
      type: object
      required:
        - ilpAddress
        - connectorUrl
      properties:
        ilpAddress:
          type: string
        connectorUrl:
          type: string
    IncomingPayment:
      type: object
      required:
        - id
        - walletAddressId
        - state
        - receivedAmount
      properties:
        id:
          type: string
        walletAddressId:
          type: string
        state:
          $ref: '#/components/schemas/IncomingPaymentState'
        incomingAmount:
          $ref: '#/components/schemas/Amount'
        receivedAmount:
          type: number
        expiresAt:
          type: string
          format: date-time
        metadata:
          type: object
          unevaluatedProperties: {}
    IncomingPaymentCreate:
      type: object
      required:
        - walletAddressId
        - expiresAt
      properties:
        id:
          type: string
          description: Client-provided ID. Auto-generated if omitted.
        walletAddressId:
          type: string
          description: ID of the wallet address that will receive the payment.
        incomingAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Max amount to receive.
        expiresAt:
          type: string
          format: date-time
          description: Date and time that the incoming payment will expire.
        metadata:
          type: object
          unevaluatedProperties: {}
    IncomingPaymentState:
      type: string
      enum:
        - CREATED
        - EXPIRED
        - COMPLETED
    LiquidityRequest:
      type: object
      required:
        - amount
        - scale
      properties:
        amount:
          type: number
          description: Amount of liqudity to deposit.
        scale:
          type: string
          description: Decimal precision of the amount.
    OutgoingPayment:
      type: object
      required:
        - id
        - senderWalletAddressId
        - incomingPaymentId
        - state
        - assetCode
        - assetScale
        - debitAmount
        - sentAmount
      properties:
        id:
          type: string
        senderWalletAddressId:
          type: string
        quoteId:
          type: string
        incomingPaymentId:
          type: string
        state:
          $ref: '#/components/schemas/OutgoingPaymentState'
        assetCode:
          type: string
        assetScale:
          type: number
        debitAmount:
          type: number
        sentAmount:
          type: number
        metadata:
          type: object
          unevaluatedProperties: {}
    OutgoingPaymentApprove:
      type: object
    OutgoingPaymentCreate:
      type: object
      required:
        - senderWalletAddressId
      properties:
        id:
          type: string
          description: Client-provided ID. Auto-generated if omitted.
        senderWalletAddressId:
          type: string
          description: ID of the wallet address that will send the payment.
        quoteId:
          type: string
          description: ID of the quote to execute. Mutually exclusive with incomingPaymentId/debitAmount.
        incomingPaymentId:
          type: string
          description: ID of the incoming payment to pay directly. Requires debitAmount. Mutually exclusive with quoteId.
        debitAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Amount to debit. Required when using incomingPaymentId.
        metadata:
          type: object
          unevaluatedProperties: {}
      description: Create an outgoing payment from a quote. Provide quoteId. Or create directly from an incoming payment by providing incomingPaymentId and debitAmount instead.
    OutgoingPaymentReject:
      type: object
      properties:
        reason:
          type: string
          description: Reason for rejecting the payment.
    OutgoingPaymentState:
      type: string
      enum:
        - PENDING
        - FUNDED
        - COMPLETED
        - REJECTED
    PageInfo:
      type: object
      required:
        - hasPreviousPage
        - hasNextPage
      properties:
        startCursor:
          type: string
        endCursor:
          type: string
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean
    Peer:
      type: object
      required:
        - id
        - name
        - assetCode
        - address
        - liquidity
      properties:
        id:
          type: string
        name:
          type: string
        assetCode:
          type: string
        initialLiquidity:
          type: integer
        liquidityLowThreshold:
          type: integer
        liquidityHighThreshold:
          type: integer
        address:
          type: string
        liquidity:
          type: integer
    PeerCreate:
      type: object
      required:
        - name
        - assetCode
      properties:
        name:
          type: string
        assetCode:
          type: string
        initialLiquidity:
          type: integer
        liquidityLowThreshold:
          type: integer
        liquidityHighThreshold:
          type: integer
    PeerUpdate:
      type: object
      properties:
        name:
          type: string
        liquidityLowThreshold:
          type: integer
        liquidityHighThreshold:
          type: integer
    Quote:
      type: object
      required:
        - id
        - senderWalletAddressId
        - incomingPaymentId
        - debitAmount
        - receiveAmount
        - exchangeRate
        - expiresAt
      properties:
        id:
          type: string
        senderWalletAddressId:
          type: string
        incomingPaymentId:
          type: string
        debitAmount:
          $ref: '#/components/schemas/Amount'
        receiveAmount:
          $ref: '#/components/schemas/Amount'
        exchangeRate:
          type: number
        expiresAt:
          type: string
          format: date-time
    QuoteCreate:
      type: object
      required:
        - senderWalletAddressId
        - incomingPaymentId
      properties:
        id:
          type: string
          description: Client-provided ID. Auto-generated if omitted.
        senderWalletAddressId:
          type: string
          description: ID of the wallet address that will send the payment.
        incomingPaymentId:
          type: string
          description: ID of the incoming payment to quote against.
        debitAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Fixed send amount. Mutually exclusive with receiveAmount.
        receiveAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Fixed receive amount. Mutually exclusive with debitAmount.
      description: Create a quote for a payment. Provide either debitAmount or receiveAmount, but not both. If neither is provided, the incoming payment's incomingAmount is used. If the incoming payment has no incomingAmount and neither is provided, the request will fail with an InvalidQuoteAmountError.
    QuoteError:
      type: object
      required:
        - errorType
        - message
      properties:
        errorType:
          type: string
          description: Error type identifier, e.g. InvalidQuoteAmountError.
        message:
          type: string
    WalletAddress:
      type: object
      required:
        - address
        - assetScale
        - assetCode
        - publicName
      properties:
        address:
          type: string
        assetScale:
          type: number
        assetCode:
          type: string
        publicName:
          type: string
        isActive:
          type: boolean
    WalletAddressCreate:
      type: object
      required:
        - assetCode
        - publicName
      properties:
        assetCode:
          type: string
        publicName:
          type: string
        isActive:
          type: boolean
    WalletAddressKey:
      type: object
      required:
        - id
        - jwk
      properties:
        id:
          type: string
        jwk:
          type: string
    WalletAddressUpdate:
      type: object
      properties:
        publicName:
          type: string
        isActive:
          type: boolean
