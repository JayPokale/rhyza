syntax = "proto3";
import "google/protobuf/any.proto";

/*
Common base protocol buffers messages for kafka transport
Specific payload messages, should be in the respective BC implementations lib
*/

// must match MessageTypes
enum PbKafkaMessageTypes {
    STATE_EVENT = 0;
    SNAPSHOT_EVENT = 1;
    DOMAIN_EVENT = 2;
    COMMAND = 3;
}

message PbKafkaMessage{
    PbKafkaMessageTypes msg_type = 1;
    string msg_id = 2;
    string msg_name = 3;
    int64 msg_timestamp = 4;

    optional string aggregate_id = 10;
    optional string aggregate_version = 11;

    google.protobuf.Any payload = 5;
}

message PbStateEvent {
    PbKafkaMessageTypes msgType = 1;
    string msg_id = 2;
    string msg_name = 3;
    int64 msg_timestamp = 4;

    string aggregate_id = 10;
    string aggregate_version = 11;

    google.protobuf.Any payload = 5;
}

message PbSnapshotEvent {
    PbKafkaMessageTypes msgType = 1;
    string msg_id = 2;
    string msg_name = 3;
    int64 msg_timestamp = 4;

    string aggregate_id = 10;
    string aggregate_version = 11;

    uint32 last_event_index_partition = 12;
    uint64 last_event_index_offset = 13;

    google.protobuf.Any payload = 5;
}

message PbCommandMsg {
  PbKafkaMessageTypes msgType = 1;
  string msg_id = 2;
  string msg_name = 3;
  int64 msg_timestamp = 4;

  string aggregate_id = 10;
  string request_id = 11;

  google.protobuf.Any payload = 5;
}


// event payloads

message PbLedgerAccountState{
    string id = 1;
    string name = 2;
    string asset_code = 3;
    uint32 asset_display_scale = 4;
    string debited_amount = 5;
    string credited_amount = 6;
}

message PbLedgerSnapshotPayload{
    repeated PbLedgerAccountState accounts = 1;
    uint64 transaction_count = 2;
    uint32 asset_scale = 3;
}

message PbLedgerAccountCreatedStatePayload{
    PbLedgerAccountState account = 1;
}

message PbLedgerCreatedStatePayload{
    string ledger_id = 1;
    uint32 asset_scale = 2;
}

message PbLedgerTransactionRecordedStatePayload{
    string id = 1;
    string debited_account_id = 2;
    string credited_account_id = 3;
    string amount =4;
    uint32 amount_scale = 5;
    uint64 timestamp = 6;
}

// commands
message PbCreateLedgerCmdPayload{
    string ledger_id = 1;
}

message PbCreateLedgerAccountCmdPayload{
    string ledger_id = 1;
    string name = 2;
    string asset_code = 3;
    uint32 asset_display_scale = 4;
}

message PbPostTransactionCmdPayload{
    string id = 1;
    string debited_account_id = 2;
    string credited_account_id = 3;
    string amount =4;
    uint32 amount_scale = 5;
}
