openapi: 3.1.0
info:
  title: Rafiki Webhooks
  version: 0.0.0
webhooks:
  paymentIntentCreated:
    post:
      summary: Payment intent created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentIntentEvent'
      responses:
        '200':
          description: Payment intent created
  paymentCreated:
    post:
      summary: Payment created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEvent'
      responses:
        '200':
          description: Payment created

components:
  schemas:
    paymentIntentEvent:
      oneOf:
        - $ref: '#/components/schemas/paymentIntent'
        - $ref: '#/components/schemas/error'
    paymentIntent:
      required:
        - id
        - walletAddressId
        - createdAt
        - expiresAt
        - receivedAmount
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - CREATED
            - COMPLETED
        walletAddressId:
          type: string
          format: uuid
        incomingAmount:
          type: number
        receivedAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    paymentEvent:
      oneOf:
        - $ref: '#/components/schemas/payment'
        - $ref: '#/components/schemas/error'
    payment:
      type: object
      required:
        - id
        - walletAddressId
        - createdAt
        - debitAmount
        - sentAmount
        - receiveAmount
        - state
      properties:
        id:
          type: string
          format: uuid
        walletAddressId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - CREATED
            - COMPLETED
        paymentIntentId:
          type: string
          format: uri
        debitAmount:
          type: number
        sentAmount:
          type: number
        receiveAmount:
          type: number
        createdAt:
          type: string
          format: date-time
    error:
      properties:
        reason:
          type: string
