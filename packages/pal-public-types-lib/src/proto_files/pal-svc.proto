syntax = "proto3";
package rafiki.pal.svc;

import "google/protobuf/empty.proto";

service PalGrpc {
  rpc CreateAsset(PbCreateAssetRequest) returns (PbCreateAssetResponse);
  rpc GetAsset(PbGetAssetRequest) returns (PbGetAssetResponse);

  rpc CreateWalletAddress(PbCreateWalletAddressRequest) returns (PbCreateWalletAddressResponse);
  rpc GetWalletAddresses(PbGetWalletAddressesRequest) returns (PbGetWalletAddressesResponse);

  rpc ResolveWalletAddressAlias(PbResolveWalletAddressAliasRequest) returns (PbResolveWalletAddressAliasResponse);
  rpc CreateWalletAddressAlias(PbCreateWalletAddressAliasRequest) returns (google.protobuf.Empty);

  // high level liquidity API
  rpc LedgerProcessHighLevelRequests(PbLedgerHighLevelRequestList) returns (PbLedgerHighLevelResponseList);

  // TODO low level liquidity API
  //rpc LedgerProcessHighLevelRequests(PbLedgerHighLevelRequestList) returns (PbLedgerHighLevelResponseList);
}

/*
Asset messages
*/
message PbCreateAssetRequest{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidity_low_threshold = 3;
  optional uint64 liquidity_high_threshold = 4;
}
message PbCreateAssetResponse{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidity_low_threshold = 3;
  optional uint64 liquidity_high_threshold = 4;
}

message PbGetAssetRequest{
  string code = 1;
}
message PbGetAssetResponse{
  optional PbGetNonEmptyAssetResponse asset = 1;
}
message PbGetNonEmptyAssetResponse{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidity_low_threshold = 3;
  optional uint64 liquidity_high_threshold = 4;
}

/*
Wallet Address messages
*/

message PbCreateWalletAddressRequest {
  string path_name = 1;
  string asset_code = 2;
  string public_name = 3;
  optional bool is_active = 4;
  optional string domain = 5;
}

message PbCreateWalletAddressResponse {
  string path_name = 1;
  string public_name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  bool is_active = 5;
  optional string domain = 6;
}

message PbGetWalletAddressesRequest {
  repeated string ids = 1;
}

message PbGetWalletAddressesResponse {
  repeated PbSingleWalletAddressResponse wallet_addresses = 1;
}
message PbSingleWalletAddressResponse {
  string id = 1;
  string public_name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  bool is_active = 5;
}

/*
Wallet Address Aliases messages
*/
message PbResolveWalletAddressAliasRequest {
  string path_name = 1;
  optional string domain =2;
}
message PbResolveWalletAddressAliasResponse {
  optional PbResolveWalletAddressNonEmptyResponse alias = 1;
}
message PbResolveWalletAddressNonEmptyResponse {
  string path_name = 1;
  optional string domain = 2;
  string wallet_address_id = 3;
}

message PbCreateWalletAddressAliasRequest {
  string path_name = 1;
  optional string domain = 2;
  string wallet_address_id = 3;
}

/*
Liquidity messages
*/

// High level requests
message PbLedgerHighLevelRequestList{
  repeated PbLedgerHighLevelRequest requests = 1;
}

message PbLedgerHighLevelRequest{
  oneof high_level_request_type{
    PbLedgerTransferCheckAndReserveRequest check_and_reserve_request = 1;
    PbLedgerCommitTransferRequest commit_request = 2;
    PbLedgerCancelTransferRequest reject_request = 3;
  }
}
message PbLedgerTransferCheckAndReserveRequest{
  string request_id = 1;
  string transfer_id = 2;
  string payer_clearing_accountId = 3;
  string payer_liquidity_accountId = 4;
  string suspense_accountId = 5;
  string amount = 6;
  uint32 amount_scale = 7;
}

message PbLedgerCommitTransferRequest{
  string request_id = 1;
  string transfer_id = 2;
  string payer_clearing_accountId = 3;
  string suspense_accountId = 4;
  string payee_clearing_accountId = 5;
  string amount = 6;
  uint32 amount_scale = 7;
}

message PbLedgerCancelTransferRequest{
  string request_id = 1;
  string transfer_id = 2;
  string payer_clearing_accountId = 3;
  string suspense_accountId = 4;
  string amount = 5;
  uint32 amount_scale = 6;
}

message PbLedgerHighLevelResponseList{
  repeated PbLedgerHighLevelResponse responses = 1;
}

message PbLedgerHighLevelResponse {
  string request_id = 1;
  uint32 request_type = 2;
  bool success = 3;
  optional string error_message = 4;
}

// Low level requests
