syntax = "proto3";
package rafiki.pal.svc;

service PalGrpc {
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);

  rpc CreateWalletAddress(CreateWalletAddressRequest) returns (CreateWalletAddressResponse);
  rpc GetWalletAddress(GetWalletAddressRequest) returns (GetWalletAddressResponse);
}

/*
Asset messages
*/
message CreateAssetRequest{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidityLowThreshold = 3;
  optional uint64 liquidityHighThreshold = 4;
}
message CreateAssetResponse{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidityLowThreshold = 3;
  optional uint64 liquidityHighThreshold = 4;
}

message GetAssetRequest{
  string code = 1;
}
message GetAssetResponse{
  optional GetNonEmptyAssetResponse asset = 1;
}
message GetNonEmptyAssetResponse{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidityLowThreshold = 3;
  optional uint64 liquidityHighThreshold = 4;
}

/*
Wallet Address messages
*/

message CreateWalletAddressRequest{
  string address = 1;
  string assetCode = 2;
  string publicName = 3;
  optional bool isActive = 4;
}
message CreateWalletAddressResponse{
  string address = 1;
  string publicName = 2;
  string assetCode = 3;
  uint32 assetScale = 4;
  bool isActive = 5;
}

message GetWalletAddressRequest{
  string address = 1;
}
message GetWalletAddressResponse{
  optional GetNonEmptyWalletAddressResponse walletAddress = 1;
}
message GetNonEmptyWalletAddressResponse{
  string address = 1;
  string publicName = 2;
  string assetCode = 3;
  uint32 assetScale = 4;
  bool isActive = 5;
}

