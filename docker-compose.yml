services:
  rafiki-poc:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      SEED_FILE_LOCATION: /workspace/seed.json
      DATABASE_URL: postgres://postgres:password@pg_container:5432/database
    depends_on:
      pg_container:
        condition: service_healthy

  pg_container:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - '5432:5432'
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "database"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s